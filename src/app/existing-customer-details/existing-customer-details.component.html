<form class="vehicle-form" [formGroup]="vehicleForm" (ngSubmit)="submit()">

  <!-- VEHICLE NUMBER -->
  <div class="form-row">
    <label>Vehicle Number</label>
    <input type="text" formControlName="vehicleNumber" />
  </div>

  <!-- VEHICLE TYPE -->
  <div class="form-row">
    <label>Vehicle Type</label>
    <input type="text" formControlName="vehicleType" />
  </div>

  <!-- CUSTOMER NAME -->
  <div class="form-row">
    <label>Customer Name</label>
    <input type="text" formControlName="customerName" />
  </div>

  <div class="form-row">
    <label>Customer Phone No</label>
    <input type="text" formControlName="customerPhoneNbr" />
  </div>

  <!-- CUSTOMER TYPE -->
  <div class="form-row">
    <label>Customer Type</label>
    <select formControlName="customerType">
      <option value="">Select</option>
      <option value="Daily">Daily</option>
      <option value="Monthly">Monthly</option>
    </select>
  </div>

  <!-- AMOUNT -->
  <div class="form-row">
    <label>Amount</label>
    <input type="text" formControlName="amount" />
  </div>

  <!-- FROM DATE -->
  <div class="form-row">
    <label>From Date</label>
    <input type="text" formControlName="fromDate" />
  </div>

  <!-- NOTE -->
  <div class="form-row">
    <label>Note</label>
    <input type="text" formControlName="note" />
  </div>

  <!-- DAILY CUSTOMER FIELDS -->
  <div
    class="daily-section"
    *ngIf="vehicleForm.get('customerType')?.value === 'Daily'"
  >
    <div class="form-row">
      <label>Bill Number</label>
      <input type="text" formControlName="billNumber" />
    </div>

    <div class="form-row">
      <label>Status</label>
      <input type="text" formControlName="status" />
    </div>
  </div>

  <!-- MONTHLY CUSTOMER FIELDS -->
  <div
    class="monthly-section"
    *ngIf="vehicleForm.get('customerType')?.value === 'Monthly'"
  >
    <div class="form-row">
      <label>Monthly Status</label>
      <input type="text" formControlName="monthlyStatus" />
    </div>

    <div class="form-row">
      <label>Advance</label>
      <input type="text" formControlName="advance" />
    </div>
  </div>

</form>
