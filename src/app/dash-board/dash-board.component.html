<div class="layout">

  <aside class="sidebar">
    <mat-nav-list>
      <a mat-list-item (click)="openMonthlyCustomerForm()">
        Monthly Customer
      </a>

      <a mat-list-item (click)="openDailyCustomerForm()">
        Daily Customer
      </a>
      <a mat-list-item [routerLink]="['/adminEntry']">
        Admin Entry
      </a>
      <a mat-list-item [routerLink]="['/monthlyPayments']">
        Monthly Payments
      </a>
      <a mat-list-item (click)="toggleReports()">
        Reports
        <!-- <mat-icon class="ml-auto">
          {{ showReports ? 'expand_less' : 'expand_more' }}
        </mat-icon> -->
      </a>

      <div *ngIf="showReports" class="nested-menu">
        <a mat-list-item routerLink="/reports/monthlyIncome">
          Monthly Income
        </a>
    
        <a mat-list-item routerLink="/reports/expense">
          Expense Report
        </a>
      </div>
    </mat-nav-list>
  </aside>

  <main class="content">
    <app-entry-form></app-entry-form>
    <!-- <app-monthly-customer-details *ngIf="monthlyCustomerForm && !dailyCustomerForm"></app-monthly-customer-details>
    <app-daily-customer-details *ngIf="dailyCustomerForm && !monthlyCustomerForm"></app-daily-customer-details> -->
  </main>

</div>
